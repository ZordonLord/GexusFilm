services:
  postgres:
    image: postgres:16-alpine
    container_name: gexusfilm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gexusfilm}
      POSTGRES_USER: ${POSTGRES_USER:-gexusfilm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gexusfilm-local-password}
    ports:
      - "5432:5432"
    volumes:
      - gexusfilm-postgres:/var/lib/postgresql/data
      - ./backend/database.sql:/docker-entrypoint-initdb.d/001-database.sql:ro

volumes:
  gexusfilm-postgres:
